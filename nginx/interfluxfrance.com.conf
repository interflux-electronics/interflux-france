server {
    listen 80;
    listen [::]:80;

    server_name interfluxfrance.com;
    server_name www.interfluxfrance.com;

    return 301 https://interfluxfrance.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    include                     /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam                 /etc/letsencrypt/ssl-dhparams.pem;
    ssl_certificate             /etc/letsencrypt/live/www.interfluxfrance.com/fullchain.pem;
    ssl_certificate_key         /etc/letsencrypt/live/www.interfluxfrance.com/privkey.pem;

    server_name www.interfluxfrance.com;

    return 301 https://interfluxfrance.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name interfluxfrance.com;

    include                     /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam                 /etc/letsencrypt/ssl-dhparams.pem;
    ssl_certificate             /etc/letsencrypt/live/interfluxfrance.com/fullchain.pem;
    ssl_certificate_key         /etc/letsencrypt/live/interfluxfrance.com/privkey.pem;

    add_header X-Content-Type-Options           "nosniff" always;
    add_header X-Frame-Options                  "DENY" always;
    add_header Referrer-Policy                  "strict-origin-when-cross-origin" always;

    # STATIC ASSETS → serve directly, try precompressed

    location ~* ^/(assets|images|_app/immutable|favicon|.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|eot|ttf|otf|webmanifest|json|xml))$ {
        root /var/www/interfluxfrance.com/build/client;

        try_files $uri $uri.br $uri.gz =404;

        gzip_static     on;
        expires         1y;
        access_log      off;
        add_header      Cache-Control "public, immutable";
    }

    # FINGERPRINTED ASSETS → cache aggressively

    location ~* ^/_app/immutable/ {
        expires         1y;
        add_header      Cache-Control "public, immutable";
    }

    # EVERYTHING ELSE → proxy to SvelteKit Node server

    location / {
        proxy_pass                  http://127.0.0.1:3000;
        proxy_http_version          1.1;
        proxy_set_header            Upgrade     $http_upgrade;
        proxy_set_header            Connection  "upgrade";
        proxy_set_header            Host        $host;
        proxy_set_header            X-Real-IP   $remote_addr;
        proxy_set_header            X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
        proxy_set_header            X-Forwarded-Host  $host;
        # proxy_set_header          X-Forwarded-Port  $server_port;   # sometimes needed

        proxy_read_timeout          90s;
        proxy_send_timeout          90s;

        # For large file uploads / long SSE / etc.
        proxy_buffer_size           128k;
        proxy_buffers               4 256k;
        proxy_busy_buffers_size     256k;
    }

    # 404 → fallback to index.html (for client-side routing)
    error_page 404 = @svelte_fallback;
    location @svelte_fallback {
        proxy_pass http://127.0.0.1:3000;
    }
}