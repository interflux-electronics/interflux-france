server {
    listen 80;
    listen [::]:80;

    server_name prototype.interflux.fr;

    return 301 https://prototype.interflux.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name prototype.interflux.fr;

    # Serve static files & precompressed assets directly (fast!)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|eot|ttf|otf)$ {
        root /home/appuser/app/build;
        try_files $uri $uri/ =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.(br|gz)$ {
        root /home/appuser/app/build;
        add_header Content-Encoding br gzip;
        types { } default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}